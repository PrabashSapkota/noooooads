  <!-- ✅ SANDBOX DETECTION — Runs before anything else -->
  <script>
    (function () {
      var sandboxDetected = false;

      // Only flag when we're actually inside an iframe
      if (window.self !== window.top) {

        // Method 1: Try reading top.location — only throws SecurityError under sandbox
        // (same-origin iframes without sandbox can read this fine)
        try {
          var _ = window.top.location.href;
          // No error = not sandboxed (or sandbox with allow-same-origin on same origin)
        } catch (e) {
          // SecurityError = sandboxed iframe without allow-same-origin
          sandboxDetected = true;
        }

        // Method 2: Cookie write test — sandbox blocks cookies unless allow-same-origin is set
        // Only run this as a secondary check if method 1 didn't already catch it
        if (!sandboxDetected) {
          try {
            var testKey = '__sb_chk_' + Date.now();
            document.cookie = testKey + '=1; path=/';
            if (document.cookie.indexOf(testKey) === -1) {
              sandboxDetected = true;
            }
          } catch (e) {
            sandboxDetected = true;
          }
        }
      }

      if (sandboxDetected) {
        document.addEventListener('DOMContentLoaded', function () {
          document.body.innerHTML = '';
          document.body.style.cssText = 'margin:0;padding:0;background:#000;height:100vh;width:100vw;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;';

          var overlay = document.createElement('div');

            'flex-direction:column',
            'align-items:center',
            'justify-content:center',
            'gap:20px',
            'padding:40px',
            'background:linear-gradient(135deg,#0a0a0a,#111827)',
            'border:1px solid #1e3a5f',
            'border-radius:16px',
            'max-width:480px',
            'width:90%',
            'text-align:center',
            'box-shadow:0 0 60px rgba(30,64,175,0.3)'
          ].join(';');

          overlay.innerHTML = [
            '<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">',
              '<circle cx="32" cy="32" r="30" stroke="#ef4444" stroke-width="2" fill="rgba(239,68,68,0.08)"/>',
              '<path d="M32 18v18" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>',
              '<circle cx="32" cy="44" r="2.5" fill="#ef4444"/>',

              '<br><br>',

  <title>Universal Player</title>
  <!-- Load JW Player asynchronously -->
  <script async src="https://cdn.jwplayer.com/libraries/KB5zFt7A.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: black;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      overscroll-behavior: none;
    }
    #player {
      position: relative;
      width: 100%;
      height: 100vh;
      max-width: 100vw;
      z-index: 10;
    }
    .jwplayer {
      width: 100% !important;
      height: 100vh !important;
      object-fit: contain;
    }
    .jw-controlbar {
      z-index: 1000 !important;
      touch-action: manipulation;
    }
    iframe:not(#player iframe) {
      z-index: 5 !important;
    }
    .iframe-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }
    .iframe-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      object-fit: contain;
    }
    @media screen and (max-width: 768px) {
      .jw-controlbar {
        font-size: 12px;
        padding: 8px;
      }
    }
    @media screen and (max-width: 480px) {
      .jw-controlbar {
        font-size: 10px;
        padding: 6px;
      }
    }
    @media screen and (orientation: landscape) {
      #player, .iframe-container {
        height: 100vh;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="player"></div>
  <script>
    // Preload critical resources
    (function() {
      const params = new URLSearchParams(window.location.search);
      const src = decodeURIComponent(params.get("src") || "");
      if (!src) {
        document.getElementById("player").innerHTML = "Invalid or empty URL.";
        return;
      }
      const setupPlayer = () => {
        if (typeof jwplayer === "undefined") {
          setTimeout(setupPlayer, 50);
          return;
        }
        if (src.includes(".m3u8") || src.includes(".mpd")) {
          jwplayer.key = 'XSuP4qMl+9tK17QNb+4+th2Pm9AWgMO/cYH8CI0HGGr7bdjo';
          const isDASH = src.includes(".mpd");
          jwplayer("player").setup({
            playlist: [{
              sources: [{
                file: src,
                type: isDASH ? "dash" : "hls",
                preload: "auto"
              }]
            }],
            width: "100%",
            height: "100vh",
            autostart: true,
            controls: true,
            displaytitle: false,
            stretching: "uniform",
            primary: "html5",
            mute: false,
            playbackRateControls: false,
            liveTimeout: 30,
            preload: "metadata"
          });
          jwplayer("player").on("fullscreen", (e) => {
            if (e.fullscreen) {
              jwplayer("player").setControls(true);
            }
          });
          const resizePlayer = () => {
            jwplayer("player").resize("100%", window.innerHeight);
          };
          window.addEventListener("orientationchange", resizePlayer);
          window.addEventListener("resize", resizePlayer);
          resizePlayer(); // Initial call
        } else {
          const container = document.createElement("div");
          container.className = "iframe-container";
          const iframe = document.createElement("iframe");
          iframe.src = src;
          iframe.allow = "autoplay; fullscreen; picture-in-picture";
          iframe.sandbox = "allow-forms allow-pointer-lock allow-same-origin allow-scripts allow-top-navigation";
          iframe.style.cssText = "width:100%;height:100vh;";
          iframe.loading = "lazy";
          container.appendChild(iframe);
          document.body.innerHTML = "";
          document.body.appendChild(container);
        }
      };
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", setupPlayer);
      } else {
        setupPlayer();
      }
    })();
  </script>
</body>
</html>
