<html lang="en">
<head>
  <script data-cfasync="false" src="//d2dxy39sqorbhv.cloudfront.net/?syxdd=1258773"></script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Universal Player</title>
  <!-- Load JW Player asynchronously -->
  <script async src="https://cdn.jwplayer.com/libraries/KB5zFt7A.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: black;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      overscroll-behavior: none;
    }
    #player {
      position: relative;
      width: 100%;
      height: 100vh;
      max-width: 100vw;
      z-index: 10;
    }
    .jwplayer {
      width: 100% !important;
      height: 100vh !important;
      object-fit: contain;
    }
    .jw-controlbar {
      z-index: 1000 !important;
      touch-action: manipulation;
    }
    iframe:not(#player iframe) {
      z-index: 5 !important;
    }
    .iframe-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }
    .iframe-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      object-fit: contain;
    }
    @media screen and (max-width: 768px) {
      .jw-controlbar {
        font-size: 12px;
        padding: 8px;
      }
    }
    @media screen and (max-width: 480px) {
      .jw-controlbar {
        font-size: 10px;
        padding: 6px;
      }
    }
    @media screen and (orientation: landscape) {
      #player, .iframe-container {
        height: 100vh;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="player"></div>
  <script>
    // Preload critical resources
    (function() {
      const params = new URLSearchParams(window.location.search);
      const src = decodeURIComponent(params.get("src") || "");
      if (!src) {
        document.getElementById("player").innerHTML = "Invalid or empty URL.";
        return;
      }
      const setupPlayer = () => {
        if (typeof jwplayer === "undefined") {
          setTimeout(setupPlayer, 50);
          return;
        }
        if (src.includes(".m3u8") || src.includes(".mpd")) {
          jwplayer.key = 'XSuP4qMl+9tK17QNb+4+th2Pm9AWgMO/cYH8CI0HGGr7bdjo';
          const isDASH = src.includes(".mpd");
          jwplayer("player").setup({
            playlist: [{
              sources: [{
                file: src,
                type: isDASH ? "dash" : "hls",
                preload: "auto"
              }]
            }],
            width: "100%",
            height: "100vh",
            autostart: true,
            controls: true,
            displaytitle: false,
            stretching: "uniform",
            primary: "html5",
            mute: false,
            playbackRateControls: false,
            liveTimeout: 30,
            preload: "metadata"
          });
          jwplayer("player").on("fullscreen", (e) => {
            if (e.fullscreen) {
              jwplayer("player").setControls(true);
            }
          });
          const resizePlayer = () => {
            jwplayer("player").resize("100%", window.innerHeight);
          };
          window.addEventListener("orientationchange", resizePlayer);
          window.addEventListener("resize", resizePlayer);
          resizePlayer(); // Initial call
        } else {
          const container = document.createElement("div");
          container.className = "iframe-container";
          const iframe = document.createElement("iframe");
          iframe.src = src;
          iframe.allow = "autoplay; fullscreen; picture-in-picture";
          iframe.sandbox = "allow-forms allow-pointer-lock allow-same-origin allow-scripts allow-top-navigation";
          iframe.style.cssText = "width:100%;height:100vh;";
          iframe.loading = "lazy";
          container.appendChild(iframe);
          document.body.innerHTML = "";
          document.body.appendChild(container);
        }
      };
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", setupPlayer);
      } else {
        setupPlayer();
      }
    })();
  </script>
</body>
</html>
