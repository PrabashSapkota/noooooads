<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Universal Player</title>
  <script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: black;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      overscroll-behavior: none;
    }
    #player {
      position: relative;
      width: 100%;
      height: 100vh;
      max-width: 100vw;
      z-index: 10;
    }
    #player [data-player] {
      width: 100% !important;
      height: 100vh !important;
    }
    .iframe-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }
    .iframe-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    @media screen and (orientation: landscape) {
      #player, .iframe-container {
        height: 100vh;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="player"></div>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const src = decodeURIComponent(params.get("src") || "");

      if (!src) {
        document.getElementById("player").innerHTML = "Invalid or empty URL.";
        return;
      }

      const isHLS  = src.includes(".m3u8");
      const isDASH = src.includes(".mpd");

      if (isHLS || isDASH) {
        const player = new Clappr.Player({
          source: src,
          parentId: "#player",
          width: "100%",
          height: "100vh",
          autoPlay: true,
          mute: false,
          hlsjsConfig: {
            enableWorker: true,
            lowLatencyMode: true
          }
        });

        const resizePlayer = () => {
          player.resize({ width: "100%", height: window.innerHeight });
        };

        window.addEventListener("resize", resizePlayer);
        window.addEventListener("orientationchange", resizePlayer);
        resizePlayer();
      } else {
        const container = document.createElement("div");
        container.className = "iframe-container";

        const iframe = document.createElement("iframe");
        iframe.src = src;
        iframe.allow = "autoplay; fullscreen; picture-in-picture";
        iframe.sandbox = "allow-forms allow-pointer-lock allow-same-origin allow-scripts allow-top-navigation";
        iframe.loading = "lazy";

        container.appendChild(iframe);
        document.body.innerHTML = "";
        document.body.appendChild(container);
      }
    })();
  </script>
</body>
</html>
