<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Universal Player</title>
  <script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
  <style>
    :root {
      --accent: #6c5ce7;
      --accent-light: #a29bfe;
      --control-bg: rgba(15, 15, 20, 0.55);
      --control-bg-solid: rgba(10, 10, 14, 0.9);
      --text: #f5f5f7;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: black;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Arial, sans-serif;
      overscroll-behavior: none;
    }

    #player {
      position: relative;
      width: 100%;
      height: 100vh;
      max-width: 100vw;
      z-index: 10;
    }

    #player [data-player] {
      width: 100% !important;
      height: 100vh !important;
    }

    .iframe-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .iframe-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    @media screen and (orientation: landscape) {
      #player, .iframe-container {
        height: 100vh;
        width: 100%;
      }
    }

    /* ============================================= */
    /*  Custom Clappr Media Control Skin              */
    /* ============================================= */

    /* Bottom bar container + fade gradient behind controls */
    .media-control {
      bottom: 0 !important;
      transition: opacity 0.35s ease;
    }

    .media-control-background {
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.85) 0%,
        rgba(0, 0, 0, 0.45) 55%,
        rgba(0, 0, 0, 0) 100%
      ) !important;
      height: 140px !important;
    }

    .media-control [data-media-control],
    .media-control .drawer-icons,
    .media-control .bottom-gear-icon {
      padding: 0 14px !important;
    }

    /* Seek / progress bar */
    .bar-container {
      height: 14px !important;
      cursor: pointer;
    }

    .seek-bar-container,
    .sk-container {
      background: rgba(255, 255, 255, 0.18) !important;
      border-radius: 6px !important;
      height: 4px !important;
      transition: height 0.15s ease;
    }

    .bar-container:hover .seek-bar-container,
    .bar-container:hover .sk-container {
      height: 6px !important;
    }

    .seek-bar-loaded,
    .sk-buffer {
      background: rgba(255, 255, 255, 0.35) !important;
      border-radius: 6px !important;
    }

    .seek-bar-played,
    .sk-progress {
      background: linear-gradient(90deg, var(--accent) 0%, var(--accent-light) 100%) !important;
      border-radius: 6px !important;
    }

    .seek-bar-scrubber,
    .sk-scrubber,
    .scrubber {
      background: #ffffff !important;
      box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.35);
      width: 13px !important;
      height: 13px !important;
      border-radius: 50% !important;
      transform: scale(0);
      transition: transform 0.15s ease;
    }

    .bar-container:hover .seek-bar-scrubber,
    .bar-container:hover .sk-scrubber,
    .bar-container:hover .scrubber {
      transform: scale(1);
    }

    /* Buttons: play, pause, stop, fullscreen, hd, volume icon */
    .media-control-icon,
    .drawer-icons svg,
    .play-wrapper,
    .pause-wrapper,
    .stop-wrapper,
    .fullscreen-icon,
    .volume-icon,
    .hd-indicator {
      color: var(--text) !important;
      fill: var(--text) !important;
      opacity: 0.9;
      transition: transform 0.18s ease, opacity 0.18s ease, fill 0.18s ease;
    }

    .media-control-icon:hover,
    .drawer-icons svg:hover,
    .play-wrapper:hover,
    .pause-wrapper:hover,
    .stop-wrapper:hover,
    .fullscreen-icon:hover,
    .volume-icon:hover {
      opacity: 1;
      fill: var(--accent-light) !important;
      transform: scale(1.15);
    }

    .play-wrapper, .pause-wrapper, .stop-wrapper {
      margin-right: 4px !important;
    }

    /* Volume slider */
    .volume-bar-container,
    .volume-bar-background {
      background: rgba(255, 255, 255, 0.2) !important;
      border-radius: 6px !important;
    }

    .volume-bar-fill,
    .bar-fill-1 {
      background: linear-gradient(90deg, var(--accent) 0%, var(--accent-light) 100%) !important;
      border-radius: 6px !important;
    }

    .volume-bar-scrub,
    .segmented-bar-element {
      background: #ffffff !important;
    }

    /* Time display */
    .media-control .time,
    .media-control [class*="time"] {
      color: var(--text) !important;
      font-size: 12px !important;
      font-variant-numeric: tabular-nums;
      opacity: 0.85;
    }

    /* Settings / gear menu */
    .drawer-container,
    .submenu {
      background: var(--control-bg-solid) !important;
      border-radius: 10px !important;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5) !important;
      overflow: hidden;
    }

    .drawer-container li,
    .submenu li {
      transition: background 0.15s ease;
    }

    .drawer-container li:hover,
    .submenu li:hover {
      background: rgba(108, 92, 231, 0.25) !important;
    }

    /* Big center play button (poster / initial state) */
    .media-control-play-big,
    .poster-icon,
    .play-button {
      background: rgba(108, 92, 231, 0.85) !important;
      border-radius: 50% !important;
      box-shadow: 0 4px 20px rgba(108, 92, 231, 0.5);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .media-control-play-big:hover,
    .poster-icon:hover,
    .play-button:hover {
      transform: scale(1.08);
      background: var(--accent) !important;
    }

    /* Loading spinner accent */
    .spinner-three-bounce > div,
    .clappr-spinner {
      background-color: var(--accent-light) !important;
    }

    /* Slightly larger touch targets on small screens */
    @media (max-width: 600px) {
      .media-control-background { height: 120px !important; }
      .bar-container { height: 20px !important; }
      .media-control-icon, .drawer-icons svg { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <div id="player"></div>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const src = decodeURIComponent(params.get("src") || "");
      if (!src) {
        document.getElementById("player").innerHTML = "Invalid or empty URL.";
        return;
      }
      const isHLS  = src.includes(".m3u8");
      const isDASH = src.includes(".mpd");
      if (isHLS || isDASH) {
        const player = new Clappr.Player({
          source: src,
          parentId: "#player",
          width: "100%",
          height: "100vh",
          autoPlay: true,
          mute: true,
          hlsjsConfig: {
            enableWorker: true,
            lowLatencyMode: true
          }
        });
        const resizePlayer = () => {
          player.resize({ width: "100%", height: window.innerHeight });
        };
        window.addEventListener("resize", resizePlayer);
        window.addEventListener("orientationchange", resizePlayer);
        resizePlayer();
      } else {
        const container = document.createElement("div");
        container.className = "iframe-container";
        const iframe = document.createElement("iframe");
        iframe.src = src;
        iframe.allow = "autoplay; fullscreen; picture-in-picture";
        iframe.sandbox = "allow-forms allow-pointer-lock allow-same-origin allow-scripts allow-top-navigation";
        iframe.loading = "lazy";
        container.appendChild(iframe);
        document.body.innerHTML = "";
        document.body.appendChild(container);
      }
    })();
  </script>
</body>
</html>
